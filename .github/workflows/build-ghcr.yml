name: Build GHCR image

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          labels: |
            org.opencontainers.image.source=https://github.com/IAmAshishNegi/comfyui-image-ideogram4-t2i
            org.opencontainers.image.description=RunPod ComfyUI Ideogram4 worker with runtime model downloads
          tags: |
            ghcr.io/iamashishnegi/comfyui-image-ideogram4-t2i:runtime-download
            ghcr.io/iamashishnegi/comfyui-image-ideogram4-t2i:latest
